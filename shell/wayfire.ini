# 0-Space default Wayfire configuration.
# Copy to ~/.config/wayfire.ini to make your own; the session uses yours if it exists.

[input]
cursor_theme = Bibata-Modern-Ice
cursor_size = 24
# Alt+Shift switches between these.
xkb_layout = gb,ru
xkb_options = grp:alt_shift_toggle

[core]
plugins = autostart command vswitch wm-actions move resize blur zerospace-ring session-lock idle foreign-toplevel xdg-activation shortcuts-inhibit
# No decoration plugin and server-side mode: windows get no chrome at all.
preferred_decoration_mode = server
close_top_view = <super> KEY_Q
vwidth = 9
vheight = 1
xwayland = true

[zerospace-ring]
rotate_left = <super> KEY_LEFT
rotate_right = <super> KEY_RIGHT
overview = <super> KEY_TAB
cycle_width = <super> KEY_R
maximize = <super> KEY_F
toggle_float = <super> <shift> KEY_SPACE
# Super+drag floats a carousel window where it is, then moves or resizes it.
drag_move = <super> BTN_LEFT
drag_resize = <super> BTN_RIGHT
tile_width = 0.12
overview_width = 0.24
centre_height = 0.52
gap = 16

[vswitch]
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9
with_win_1 = <super> <shift> KEY_1
with_win_2 = <super> <shift> KEY_2
with_win_3 = <super> <shift> KEY_3
with_win_4 = <super> <shift> KEY_4
with_win_5 = <super> <shift> KEY_5
with_win_6 = <super> <shift> KEY_6
with_win_7 = <super> <shift> KEY_7
with_win_8 = <super> <shift> KEY_8
with_win_9 = <super> <shift> KEY_9
# The ring owns Super+Left/Right, so vswitch gets no arrow bindings.
binding_left = disabled
binding_right = disabled
binding_up = disabled
binding_down = disabled
with_win_left = disabled
with_win_right = disabled
with_win_up = disabled
with_win_down = disabled

# Move and resize are started by the carousel's Super+drag (above), so their
# own bindings are put somewhere no hand will reach.
[move]
activate = <super> <ctrl> <alt> <shift> BTN_EXTRA

[resize]
activate = <super> <ctrl> <alt> <shift> BTN_SIDE

[command]
binding_launcher = <super> KEY_SPACE
command_launcher = 0space-call launcher toggle
binding_terminal = <super> KEY_T
command_terminal = mirrorwave
binding_browser = <super> KEY_W
command_browser = firefox
binding_discord = <super> KEY_D
command_discord = discord
binding_media = <super> KEY_V
command_media = vlc
binding_files = <super> KEY_E
command_files = thunar
binding_anime = <super> KEY_A
command_anime = mirrorwave --title ani-cli ani-cli
binding_vpn = <super> KEY_P
command_vpn = protonvpn-app
binding_lock = <super> KEY_X
command_lock = swaylock -f -C /etc/swaylock/config
binding_suspend = <super> KEY_Z
command_suspend = systemctl suspend
binding_screenshot = <super> <shift> KEY_S
command_screenshot = sh -c 'region=$(slurp) && grim -g "$region" - | swappy -f -'
binding_power = <super> KEY_ESC
command_power = 0space-call power toggle
binding_corners = <super> KEY_B
command_corners = 0space-call corners toggle
binding_scan = <super> KEY_S
command_scan = mirrorwave --hold escafil scan
# Media keys; holding them repeats.
repeatable_binding_volup = KEY_VOLUMEUP
command_volup = 0space-level up
repeatable_binding_voldown = KEY_VOLUMEDOWN
command_voldown = 0space-level down
binding_mute = KEY_MUTE
command_mute = 0space-level mute
binding_micmute = KEY_MICMUTE
command_micmute = 0space-level mic
repeatable_binding_brighter = KEY_BRIGHTNESSUP
command_brighter = 0space-level brighter
repeatable_binding_dimmer = KEY_BRIGHTNESSDOWN
command_dimmer = 0space-level dimmer

[autostart]
# Scale each screen from its pixel density (2x on a 2.8K laptop panel).
scale = 0space-scale
autostart_wf_shell = false
shell = quickshell -p /usr/share/0space/shell/shell.qml
# Lock after 9 minutes idle (the screen turns off at 10) and always before sleep.
locker = swayidle -w timeout 540 'swaylock -f -C /etc/swaylock/config' before-sleep 'swaylock -f -C /etc/swaylock/config'

[idle]
screensaver_timeout = -1
dpms_timeout = 600

# Frosted glass behind Mirrorwave's see-through windows.
[blur]
# Every window is frosted glass: GTK and Mirrorwave paint see-through
# backgrounds and this blurs the Dome and windows behind them.
blur_by_default = type is "toplevel"
method = kawase
kawase_offset = 2.5
kawase_degrade = 3
kawase_iterations = 3
saturation = 1.1

[wm-actions]
toggle_fullscreen = <super> <shift> KEY_F
