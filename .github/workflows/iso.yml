# Builds the 0-Space installer ISO on GitHub's machines, so nothing has to be
# compiled at home. Run it from the Actions tab ("Run workflow"), or push to
# the iso branch. The ISO is attached to the run as "0space-linux-iso".
name: ISO

on:
  workflow_dispatch:
  push:
    branches: [iso]

# A newer push cancels an older run still building, so the newest ISO is
# always the one that finishes.
concurrency:
  group: iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      # What we build ourselves (the liberated systemd, mainly) is kept between
      # runs, so it's compiled once per systemd version, not on every run.
      - name: Restore our own builds
        uses: actions/cache/restore@v4
        with:
          path: /tmp/0space-cache
          key: own-builds-${{ hashFiles('flake.lock', 'patches/**', 'modules/features/liberated-systemd.nix') }}
          restore-keys: own-builds-

      - name: Prepare the local cache
        run: |
          mkdir -p /tmp/0space-cache
          [ -f /tmp/0space-cache/nix-cache-info ] || printf 'StoreDir: /nix/store\nWantMassQuery: 1\nPriority: 30\n' > /tmp/0space-cache/nix-cache-info
          du -sh /tmp/0space-cache

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = file:///tmp/0space-cache?trusted=1
            max-jobs = auto
            cores = 0

      - name: Build the ISO
        run: nix build .#iso --print-out-paths --log-format bar-with-logs 2>&1 | tail -n 200

      - name: Keep our own builds for next time
        run: |
          # The systemd builds the ISO actually holds (the liberated one among
          # them) and the carousel plugin, with whatever they depend on.
          nix copy --to file:///tmp/0space-cache \
            $(nix path-info --recursive ./result | grep -E -- '-systemd-[0-9]') \
            $(nix path-info .#zerospace-ring)
          du -sh /tmp/0space-cache

      - name: Save our own builds
        uses: actions/cache/save@v4
        with:
          path: /tmp/0space-cache
          key: own-builds-${{ hashFiles('flake.lock', 'patches/**', 'modules/features/liberated-systemd.nix') }}-${{ github.run_id }}

      - name: Name and checksum it
        run: |
          mkdir dist
          cp "$(find -L result/iso -name '*.iso' | head -n 1)" dist/0space-linux.iso
          cd dist && sha256sum 0space-linux.iso > 0space-linux.iso.sha256 && cat 0space-linux.iso.sha256
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: 0space-linux-iso
          path: dist/
          compression-level: 0
          retention-days: 90
