# Builds the 0-Space installer ISO on GitHub's machines, so nothing has to be
# compiled at home. Run it from the Actions tab ("Run workflow"), or push to
# the iso branch. The ISO is attached to the run as "0space-linux-iso".
name: ISO

on:
  workflow_dispatch:
  push:
    branches: [iso]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0

      - name: Build the ISO
        run: nix build .#iso --print-out-paths --log-format bar-with-logs 2>&1 | tail -n 200

      - name: Name and checksum it
        run: |
          mkdir dist
          cp "$(find -L result/iso -name '*.iso' | head -n 1)" dist/0space-linux.iso
          cd dist && sha256sum 0space-linux.iso > 0space-linux.iso.sha256 && cat 0space-linux.iso.sha256
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: 0space-linux-iso
          path: dist/
          compression-level: 0
          retention-days: 90
